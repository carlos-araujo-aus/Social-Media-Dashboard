version: '3.8'
services:

# MongoDB Service
  mongodb:
    image: mongo:8.2
    container_name: social-media-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: socialUsersDB
    ports: 
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - social-media-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    profiles:
      - local
  
# Node.js App Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-media-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - social-media-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/home', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

# Persistent volumes for MongoDB
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

#Custom network
networks:
  social-media-network:
    driver: bridge